        '票据管理':'操作重点：新增票据、维护出票/到期/兑付状态、到期提醒及票据关联凭证。',
        '银企互联':'操作重点：先确认银行、企业和账户范围，再跳转授权；返回后展示连接状态、同步流水和断开入口。',
        '一键取票':'操作重点：选企业和取票期间、最后步骤授权、预览取回票据、核验后导入；支持跳过单条异常。',
        '发票风险分析':'操作重点：查看风险规则、定位源发票、标记处理结果并保留复核人/时间。',
        '计提工资、发放工资':'操作重点：先按期间计算并复核计提批次；再按实际支付批次登记付款及差额。',
        '员工信息':'操作重点：新增/编辑员工、入离职状态变更、批量导入校验、导出脱敏控制。',
        '资产初始化':'操作重点：导入资产卡片、核对累计折旧和净值，试算通过后确认期初数据。',
        '计提折旧及生成凭证':'操作重点：选期间并预览资产级折旧，检查异常后生成一张或按规则分组的待审核凭证。',
        '资产核对总账':'操作重点：选择期间和资产科目，展示账面与台账差异并下钻到资产/凭证。',
        '备份恢复':'操作重点：下载完整备份；恢复时先校验文件格式、版本、账套和校验和，再展示覆盖预览。',
        '旧账导入':'操作重点：上传文件、映射科目/期间、显示错误清单、试导入并在确认后正式写入。'
      };
      const makePageSpec = key => {
        const module = pageModule[key] || ({vouchers:'voucher',cash:'funds',invoices:'invoice',payroll:'payroll',assets:'assets',closing:'closing',books:'books',reports:'reports',tax:'tax',settings:'settings'}[activePage] || 'books');
        const rule = moduleRules[module];
        const purpose = pagePurposes[key] || `${key}页面：说明本页的业务目标、可操作对象和结果，并与对应账套期间保持一致。`;
        return [
          `乐乐云 · ${key}页面说明（评审草案）`,
          '适用对象：产品、设计、开发、测试及财务评审。以下为交付目标；第 11 节标记当前实现差异，待确认项未确认前不得当作正式财务口径。',
          '',
          `01｜页面目标与范围\n${purpose}仅处理本页所属业务，不在页面间重复维护同一业务事实。`,
          `02｜用户、入口与前置条件\n${rule.actor}入口：左侧导航及对应业务操作跳转。`,
          `03｜页面结构与主要操作\n${rule.structure}${pageOperations[key] || purpose}`,
          `04｜字段与数据口径\n${rule.data}`,
          `05｜页面状态与反馈\n${rule.state}`,
          `06｜交互与便捷规则\n${rule.interaction}`,
          `07｜逆向流程与异常恢复\n${rule.reverse}`,
          `08｜安全、风险与审计控制\n${rule.risk}`,
          `09｜外部依赖与授权边界\n${rule.external}`,
          `10｜验收标准\n${rule.acceptance}`,
          `11｜当前实现差异与开发待办\n${rule.gap}`,
          `12｜评审待确认\n${rule.review}`,
          `13｜版本与交付记录\n版本号与保存时间以本侧栏版本记录为准｜页面：${key}｜状态：待产品/财务确认｜负责人/设计稿/开发任务：待填写。`
        ].join('\n\n');
      };
      const legacyKey = 'lele-page-notes-v1';
      let notes = {};
      let legacy = {};
      try { notes = JSON.parse(localStorage.getItem(notesKey) || '{}'); } catch (_) {}
      try { legacy = JSON.parse(localStorage.getItem(legacyKey) || '{}'); } catch (_) {}
      if (!notes || typeof notes !== 'object' || Array.isArray(notes)) notes = {};
      if (!legacy || typeof legacy !== 'object' || Array.isArray(legacy)) legacy = {};
      Object.keys(notes).forEach(key => {
        if (typeof notes[key] === 'string') {
          notes[key] = { current: { version: 1, content: notes[key], savedAt: new Date().toISOString() }, history: [], draft: null };
        } else if (notes[key] && typeof notes[key] === 'object' && !notes[key].current) {
          notes[key] = { current: { version: 1, content: String(notes[key].content ?? ''), savedAt: notes[key].savedAt || new Date().toISOString() }, history: Array.isArray(notes[key].history) ? notes[key].history : [], draft: notes[key].draft ?? null };
        }
      });
      if (!notes['首页']) {
        const initialContent = Object.prototype.hasOwnProperty.call(legacy, '首页') ? String(legacy['首页'] ?? '') : homeSpec;
        notes['首页'] = { current: { version: 1, content: initialContent, savedAt: new Date().toISOString() }, history: [], draft: null };
      }
      Object.keys(pagePurposes).forEach(key => {
        if (notes[key]) return;
        const imported = Object.prototype.hasOwnProperty.call(legacy, key) && String(legacy[key] ?? '').trim() !== '';
        const prior = imported ? String(legacy[key]) : '';
        const initial = imported ? prior : makePageSpec(key);
        notes[key] = { current: { version: 1, content: initial, savedAt: new Date().toISOString() }, history: [], draft: imported ? makePageSpec(key) : null };
      });
      let pageKey = '';
      const getPage = () => document.getElementById('breadcrumb-current')?.textContent?.trim() || '首页';
      const ensurePage = key => {
        if (!notes[key]) {
          const imported = Object.prototype.hasOwnProperty.call(legacy, key) && String(legacy[key] ?? '').trim() !== '';
          const prior = imported ? String(legacy[key]) : '';
          notes[key] = { current: { version: 1, content: imported ? prior : makePageSpec(key), savedAt: new Date().toISOString() }, history: [], draft: imported ? makePageSpec(key) : null };
        }
        if (!Array.isArray(notes[key].history)) notes[key].history = [];
        if (!Object.prototype.hasOwnProperty.call(notes[key], 'draft')) notes[key].draft = null;
        return notes[key];
      };
      const persist = () => {
        if (!pageKey) return;
        const page = ensurePage(pageKey);
        const currentContent = page.current?.content ?? '';
        page.draft = editor.value === currentContent ? null : editor.value;
        localStorage.setItem(notesKey, JSON.stringify(notes));
        updateDraftState();
      };
      const formatTime = value => value ? new Date(value).toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '时间未知';
      const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const updateDraftState = () => {
        const page = ensurePage(pageKey);
        const dirty = !!page.current && editor.value !== page.current.content || !page.current && editor.value.trim() !== '';
        saveButton.disabled = !dirty;
        draftState.textContent = dirty ? '有未发布的修改；草稿已自动暂存，最新版尚未改变。' : '当前内容为已保存版本';
        versionLabel.textContent = page.current ? `当前版本：V${page.current.version} · ${formatTime(page.current.savedAt)}` : '当前版本：尚未保存';
      };
      const renderHistory = () => {
        const page = ensurePage(pageKey);
        historyCount.textContent = String(page.history.length);
        historyEmpty.hidden = page.history.length > 0;
        historyList.innerHTML = page.history.map((item, index) => `<article class="notes-history-item"><div class="notes-history-head"><details><summary>V${item.version} · ${escapeHtml(formatTime(item.savedAt))}</summary><pre>${escapeHtml(item.content)}</pre></details><button type="button" data-note-delete="${index}" aria-label="删除版本 V${item.version}">删除</button></div></article>`).join('');
      };
      const loadPage = () => {
        persist();
        pageKey = getPage();
        const page = ensurePage(pageKey);
        context.textContent = pageKey === '首页' ? '首页 · 产品 / 设计 / 开发交付说明' : `页面：${pageKey}`;
        editor.value = page.draft ?? page.current?.content ?? '';
        renderHistory();
        updateDraftState();
        localStorage.setItem(notesKey, JSON.stringify(notes));
      };
      const publishDraft = () => {
        const page = ensurePage(pageKey);
        if (saveButton.disabled) return;
        if (page.current) page.history.unshift({...page.current});
        page.current = { version: (page.current?.version || 0) + 1, content: editor.value, savedAt: new Date().toISOString() };
        page.draft = null;
        localStorage.setItem(notesKey, JSON.stringify(notes));
        renderHistory();
        updateDraftState();
      };
      const setOpen = (open, mode = 'notes') => {
        const wasOpen = shell.classList.contains('notes-open');
        panelTitle.textContent = mode === 'history' ? '注释记录' : '说明注释';
        editorView.hidden = mode === 'history';
        historyView.hidden = mode !== 'history';
        collapse.setAttribute('aria-label', mode === 'history' ? '收起注释记录' : '收起说明注释');
        shell.classList.toggle('notes-open', open);
        panel.setAttribute('aria-hidden', String(!open));
        toggle.setAttribute('aria-expanded', String(open));
        historyToggle.setAttribute('aria-expanded', String(open && mode === 'history'));
        toggle.querySelector('b').textContent = open ? '›' : '‹';
        historyToggle.querySelector('b').textContent = open ? '›' : '‹';
        localStorage.setItem(stateKey, open ? mode : 'closed');
        if (open && mode === 'notes') editor.focus({ preventScroll: true });
        else if (open && mode === 'history') {
          const firstHistoryItem = historyView.querySelector('summary');
          (firstHistoryItem || historyView.querySelector('h3'))?.focus({ preventScroll: true });
        }
        else if (!open && wasOpen) (mode === 'history' ? historyToggle : toggle).focus({ preventScroll: true });
      };
      editor.addEventListener('input', persist);
      saveButton.addEventListener('click', publishDraft);
      historyList.addEventListener('click', event => {
        const button = event.target.closest('[data-note-delete]');
        if (!button) return;
        const page = ensurePage(pageKey);
        const index = Number(button.dataset.noteDelete);
        const record = page.history[index];
        if (!record || !confirm(`确定删除历史版本 V${record.version}？删除后无法恢复。`)) return;
        page.history.splice(index, 1);
        localStorage.setItem(notesKey, JSON.stringify(notes));
        renderHistory();
      });
      toggle.addEventListener('click', () => {
        const samePanelOpen = shell.classList.contains('notes-open') && panelTitle.textContent === '说明注释';
        setOpen(!samePanelOpen, 'notes');
      });
      historyToggle.addEventListener('click', () => {
        const samePanelOpen = shell.classList.contains('notes-open') && panelTitle.textContent === '注释记录';
        setOpen(!samePanelOpen, 'history');
      });
      collapse.addEventListener('click', () => setOpen(false, panelTitle.textContent === '注释记录' ? 'history' : 'notes'));
      new MutationObserver(() => { if (getPage() !== pageKey) loadPage(); }).observe(document.getElementById('breadcrumb-current'), { childList: true, characterData: true, subtree: true });
      loadPage();
      const initialPanel = localStorage.getItem(stateKey);
      setOpen(initialPanel === 'notes' || initialPanel === '1' || initialPanel === 'history', initialPanel === 'history' ? 'history' : 'notes');
    })();
  </script>
</body>
</html>
